name: Offline unit tests (no scans)
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r services/security-agent/requirements.txt -r requirements-tools.txt
      - name: Validate Python and bash syntax
        run: |
          python -m compileall -q scripts openwebui/tools services/security-agent
          for file in start.sh stop.sh scripts/*.sh; do bash -n "$file"; done
      - name: Run synthetic tests
        run: python -m pytest -q
